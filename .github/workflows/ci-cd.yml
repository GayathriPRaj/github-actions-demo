# 1. The name of your workflow
name: My First CI-CD Pipeline

# 2. The Trigger (Event) - Run this when code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 3. The Jobs to run
jobs:
  # Job 1: Build and Test
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # The operating system for the virtual machine

    steps:
    # Step 1: Pull the code from your repo onto the virtual machine
    - name: Checkout Code
      uses: actions/checkout@v5

    # Step 2: Setup Node.js runtime
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 3. Install npm dependencies
    - name: Install dependencies
      run: npm ci

    # 4. Install Playwright browser binaries with OS dependencies
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 5. Run Playwright Tests
    - name: Run Playwright tests
      run: npm test

    # 6. Upload HTML Test Report as an Artifact (runs even if tests fail)
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    # Step 7: Simulating running tests
    - name: Run Tests Dummy
      run: echo "Running automated tests... (e.g., npm test)"

  # Job 2: Deploy (Only runs if Build and Test succeeds)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test # This forces the deploy job to wait for the test job
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Deploy Application
      run: echo "Deploying application to production server..."