# 1. The name of your workflow
name: Manual Playwright Module Run

# 2. The Trigger (Event) - Run this when code is pushed to the main branch
on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Select module to Run'
        required: true
        default: 'all'
        type: choice
        options:
          - module1
          - module2
          - all
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [ "main" ]

# 3. The Jobs to run
jobs:
  # Job 1: Build and Test
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # The operating system for the virtual machine

    steps:
    # Step 1: Pull the code from your repo onto the virtual machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Setup Node.js runtime
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 3. Install npm dependencies
    - name: Install dependencies
      run: npm ci

    # 4. Install Playwright browser binaries with OS dependencies
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Step 5: Unified Test Execution (Branching based on trigger event)
    - name: Execute Playwright Tests
      run: |
        # Case A: Triggered Manually via Actions Tab
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          MODULE="${{ github.event.inputs.module }}"
          echo "Manual trigger mode selected: $MODULE"

          if [ "$MODULE" = "module1" ]; then
            npm run test:module1
          elif [ "$MODULE" = "module2" ]; then
            npm run test:module2
          else
            npm test
          fi

        # Case B: Triggered via Pull Request (Label-based check)
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "Active PR Labels: $LABELS"

          if echo "$LABELS" | grep -q "Run Module1"; then
            echo "Running module1 tests..."
            npm run test:module1
          elif echo "$LABELS" | grep -q "Run Module2"; then
            echo "Running module2 tests..."
            npm run test:module2
          else
            echo "No specific module label found. Running full test suite..."
            npm test
          fi
        fi

    # 6. Upload HTML Test Report as an Artifact (runs even if tests fail)
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7